<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10241f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<!-- juego:inicio -->
<title>Alvarito y los Dinos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Press+Start+2P&display=swap">
<style>
  /* Layout: una columna de móvil — marcador, escena pixelada de la aventura, reloj del dino,
     botones de ayuda de la familia y tablero con letras grandes. Un solo tema: selva de noche. */
  :root {
    --bg: #10241f;
    --panel: #183a31;
    --panel-2: #21493e;
    --line: #07130f;
    --ink: #f1fbe9;
    --muted: #9cc3b0;
    --dim: #3c6457;
    --hulk: #5cb85c;
    --gold: #f6c453;
    --lava: #ff6a3d;
    --ok: #7be36b;
    --bad: #ff5a6b;
    --scrim: rgba(7, 19, 15, .86);
    --display: "Press Start 2P", ui-monospace, "Courier New", monospace;
    --letter: "Andika", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .sound-test {
    padding: 10px 14px;
    background: var(--panel-2); color: var(--ink);
    border: 3px solid var(--line); box-shadow: 0 4px 0 var(--line);
    font-family: var(--display); font-size: 10px; line-height: 1.4;
    cursor: pointer; touch-action: manipulation;
  }
  .sound-test:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--letter);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  button:disabled { cursor: default; }

  #app {
    max-width: 520px;
    min-height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding-block: 10px 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Marcador */
  .hud { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
  .hearts { display: flex; gap: 3px; font-size: 20px; line-height: 1; }
  .hearts span { color: var(--dim); }
  .hearts span.on { color: var(--bad); }
  .progress { display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--display); font-size: 9px; color: var(--muted); }
  .progress i { width: 13px; height: 13px; border: 2px solid var(--dim); }
  .progress i.on { background: var(--hulk); border-color: var(--hulk); box-shadow: 0 2px 0 var(--line); }
  .icon-btn {
    width: 40px; height: 40px;
    background: var(--panel-2);
    border: 3px solid var(--line);
    box-shadow: 0 3px 0 var(--line);
    font-family: var(--display);
    font-size: 13px;
  }
  .icon-btn[aria-pressed="true"] { color: var(--muted); text-decoration: line-through; }

  /* Escena */
  .stage { position: relative; overflow: hidden; border: 4px solid var(--line); box-shadow: 0 0 0 3px var(--panel-2); background: var(--line); }
  #scene { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .phase-tag {
    position: absolute; top: 6px; left: 6px; max-width: 70%;
    padding: 5px 7px; background: var(--scrim);
    font-family: var(--display); font-size: 8px; line-height: 1.5;
  }
  .bubble {
    position: absolute; top: 8%;
    transform: translateX(-50%);
    padding: 6px 8px;
    background: var(--ink); color: var(--line);
    border: 3px solid var(--line);
    font-family: var(--display); font-size: 8px; line-height: 1.4;
    white-space: nowrap;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -9px;
    border: 6px solid transparent; border-top-color: var(--line);
    transform: translateX(-50%);
  }
  .crash {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--display); font-size: clamp(18px, 6.5vw, 30px);
    color: var(--gold); text-shadow: 3px 3px 0 var(--lava), 6px 6px 0 var(--line);
    animation: pop .45s steps(4) both; pointer-events: none; text-align: center;
  }
  .crash.green { color: var(--hulk); text-shadow: 3px 3px 0 #2f7d32, 6px 6px 0 var(--line); }

  /* Reloj del dino: solo una barra, sin números */
  .timer { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
  .dino-ico { font-size: 24px; line-height: 1; }
  .bar { height: 18px; border: 3px solid var(--line); background: var(--panel); }
  .bar i { display: block; height: 100%; width: 100%; background: var(--ok); }
  .bar i.mid { background: var(--gold); }
  .bar i.low { background: var(--bad); }
  .bar i.paused { background: var(--muted); }

  /* Ayudas de la familia: solo sus caras */
  .helpers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .helper {
    display: grid; place-items: center;
    min-width: 0; min-height: 70px; padding: 6px;
    background: var(--panel-2);
    border: 3px solid var(--line); box-shadow: 0 4px 0 var(--line);
  }
  .helper canvas { width: 56px; height: 56px; image-rendering: pixelated; background: var(--panel); }
  .helper:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  .helper:disabled { opacity: .35; filter: grayscale(1); }

  /* Tablero */
  .board {
    position: relative; flex: 1;
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px;
    background: var(--panel);
    border: 4px solid var(--line);
    box-shadow: inset 0 0 0 3px var(--panel-2);
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .target {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    min-height: 110px; padding: 6px 44px;
    background: var(--panel-2); border: 3px solid var(--line);
  }
  .target::after {
    content: "🔊"; position: absolute; top: 6px; right: 6px;
    width: 34px; height: 34px; display: grid; place-items: center;
    background: var(--gold); border: 3px solid var(--line); font-size: 16px;
  }
  .target .ear { font-size: 70px; line-height: 1; }
  .target .big { font-size: 84px; font-weight: 700; line-height: 1; color: var(--gold); }
  .target .name { font-size: 34px; font-weight: 700; color: var(--gold); }
  .target .emoji { font-size: 60px; line-height: 1; }
  .target .word { font-size: 34px; font-weight: 700; letter-spacing: .08em; overflow-wrap: anywhere; min-width: 0; }
  .target .slot {
    display: inline-block; min-width: 1.05em; padding: 0 .08em;
    border-bottom: 5px solid var(--gold); color: var(--gold); text-align: center;
  }
  .hint { margin: 0; font-size: 54px; line-height: 1; text-align: center; }
  .answers { display: grid; gap: 10px; margin-top: auto; }
  .ans {
    min-height: 86px;
    background: var(--ink); color: var(--line);
    border: 3px solid var(--line); box-shadow: 0 6px 0 var(--line);
    font-family: var(--letter); font-size: 54px; font-weight: 700; line-height: 1;
  }
  .ans:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
  .ans.wrong { background: var(--bad); animation: wiggle .3s steps(3); opacity: .6; }
  .ans.right { background: var(--ok); }
  .ans.gone { opacity: .15; }

  /* Ventanas */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: var(--scrim);
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .card {
    width: 100%; max-width: 440px; max-height: 100%; overflow: auto;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 22px 18px; text-align: center;
    background: var(--panel); border: 4px solid var(--line);
    box-shadow: 0 0 0 4px var(--panel-2), 0 10px 0 4px var(--line);
    animation: rise .25s steps(3) both;
  }
  .card h1, .card h2 { margin: 0; font-family: var(--display); font-weight: 400; line-height: 1.5; text-wrap: balance; }
  .card h1 { font-size: 17px; color: var(--gold); text-shadow: 3px 3px 0 var(--line); }
  .card h1.bad { color: var(--lava); }
  .card h1.green { color: var(--hulk); }
  .card h2 { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .card p { margin: 0; font-size: 19px; line-height: 1.35; max-width: 34ch; }
  .card p.small { font-size: 16px; color: var(--muted); }
  .card b { color: var(--gold); }
  .logo { display: grid; gap: 8px; }
  .logo .a { color: var(--gold); font-size: clamp(18px, 6vw, 24px); }
  .logo .y { color: var(--ink); font-size: 10px; }
  .logo .d { color: var(--hulk); font-size: clamp(18px, 6vw, 24px); }
  .art { width: 260px; max-width: 100%; height: auto; image-rendering: pixelated; }
  .letters { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .letters button {
    min-width: 44px; padding: 2px 6px;
    background: var(--ink); color: var(--line); border: 3px solid var(--line);
    font-size: 26px; font-weight: 700; line-height: 1.2;
  }
  .letters.miss button { background: var(--gold); }
  .need { display: flex; gap: 6px; justify-content: center; }
  .need i { width: 18px; height: 18px; border: 3px solid var(--hulk); }
  .btns.row { grid-template-columns: 1fr 1fr; }
  .btn .ico { font-family: var(--letter); font-size: 40px; line-height: 1; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .mode {
    display: grid; gap: 4px; padding: 10px 6px;
    background: var(--panel-2); border: 3px solid var(--line); box-shadow: 0 4px 0 var(--line);
    font-family: var(--display); font-size: 9px; line-height: 1.4;
  }
  .mode small { font-family: var(--letter); font-size: 17px; font-weight: 700; letter-spacing: .06em; }
  .mode[aria-pressed="true"] { background: var(--hulk); color: var(--line); }
  .btns { display: grid; gap: 12px; width: 100%; }
  .btn {
    display: grid; gap: 6px; padding: 15px 12px;
    background: var(--gold); color: var(--line);
    border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line);
    font-family: var(--display); font-size: 13px; line-height: 1.4;
  }
  .btn small { font-family: var(--letter); font-size: 16px; font-weight: 700; }
  .btn.green { background: var(--hulk); }
  .btn.ghost { background: var(--panel-2); color: var(--ink); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }

  .shake { animation: shake .5s steps(6); }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-4px, -2px); }
    80% { transform: translate(4px, 2px); }
  }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes wiggle { 0%, 100% { transform: translateX(0); } 33% { transform: translateX(-5px); } 66% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { .shake, .crash, .card, .ans.wrong { animation: none; } }
  @media (max-height: 700px) {
    .target { min-height: 84px; }
    .helper { min-height: 60px; }
    .helper canvas { width: 46px; height: 46px; }
    .target .big { font-size: 64px; }
    .ans { min-height: 70px; font-size: 44px; }
  }
</style>

<div id="app">
  <header class="hud">
    <div class="hearts" id="hearts" aria-label="Vidas"></div>
    <div class="progress" id="progress"></div>
    <button type="button" class="icon-btn" id="mute" aria-pressed="false" aria-label="Quitar el sonido">♪</button>
  </header>

  <div class="stage">
    <canvas id="scene" width="160" height="90" aria-label="La aventura de Alvarito"></canvas>
    <div class="phase-tag" id="phaseTag">LA SELVA</div>
    <div class="bubble" id="bubble" hidden></div>
    <div class="crash" id="crash" hidden></div>
  </div>

  <div class="timer" aria-label="Tiempo hasta que llega el dino">
    <span class="dino-ico" aria-hidden="true">🦖</span>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="helpers">
    <button type="button" class="helper" id="helpDani" aria-label="Llamar a Danielito"><canvas width="16" height="16"></canvas></button>
    <button type="button" class="helper" id="helpAbuela" aria-label="Llamar a la abuela"><canvas width="16" height="16"></canvas></button>
    <button type="button" class="helper" id="helpAbuelo" aria-label="Llamar al abuelo"><canvas width="16" height="16"></canvas></button>
  </div>

  <section class="board" id="board">
    <h2 class="sr-only" id="prompt" aria-live="polite"></h2>
    <button type="button" class="target" id="target" aria-label="Escuchar otra vez"><span class="big">A</span></button>
    <p class="hint" id="hint" hidden></p>
    <div class="answers" id="answers"></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true"></div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  // ---------- Guardado local (solo comodidad: modo de letras y sonido) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
  };

  // ---------- Utilidades ----------
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Sonido chiptune ----------
  let actx = null;
  let muted = store.get('ad-muted', false);
  function ensureAudio() {
    if (!actx) {
      try { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  }
  function tone(f, dur, type = 'square', vol = 0.06, at = 0, to = null) {
    if (muted || !actx) return;
    const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.2, at = 0) {
    if (muted || !actx) return;
    const n = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = actx.createBufferSource(), g = actx.createGain();
    s.buffer = buf; g.gain.value = vol;
    s.connect(g).connect(actx.destination);
    s.start(actx.currentTime + at);
  }
  const sfx = {
    click: () => tone(660, 0.05, 'square', 0.04),
    ok: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, 'square', 0.06, i * 0.07)),
    bad: () => tone(220, 0.25, 'sawtooth', 0.06, 0, 110),
    tick: () => tone(1200, 0.03, 'square', 0.03),
    roar: () => { tone(160, 0.7, 'sawtooth', 0.08, 0, 60); noise(0.6, 0.12); },
    chomp: () => { noise(0.08, 0.35); noise(0.08, 0.35, 0.16); tone(90, 0.3, 'square', 0.08, 0, 50); },
    hulk: () => [131, 165, 196, 262].forEach((f, i) => tone(f, 0.12, 'square', 0.08, i * 0.06)),
    boing: () => tone(200, 0.35, 'sine', 0.12, 0, 700),
    splash: () => noise(0.4, 0.2),
    whoosh: () => tone(900, 0.3, 'triangle', 0.06, 0, 200),
    throw: () => tone(500, 0.18, 'triangle', 0.06, 0, 1000),
    phase: () => [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.06, i * 0.1)),
    lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, 'triangle', 0.08, i * 0.2)),
  };

  // ---------- Voz (lee las letras en voz alta: Alvarito todavía no lee) ----------
  const synth = window.speechSynthesis || null;
  let voice = null;
  function pickVoice() {
    try {
      const vs = synth.getVoices();
      voice = vs.find(v => /^es[-_]ES/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
    } catch (e) { voice = null; }
  }
  if (synth) { pickVoice(); try { synth.onvoiceschanged = pickVoice; } catch (e) { /* sin voces */ } }
  // Cada personaje habla con su tono: Alvarito agudo, el abuelo grave, el dino con vozarrón.
  const VOICE = {
    narr: { pitch: 1.1, rate: 0.9 },
    alva: { pitch: 1.7, rate: 1.0 },
    dani: { pitch: 1.4, rate: 1.0 },
    abuela: { pitch: 1.05, rate: 0.9 },
    abuelo: { pitch: 0.7, rate: 0.85 },
    dino: { pitch: 0.1, rate: 0.75 },
  };
  // Chrome pierde la frase si se habla justo después de cortar otra: tras cortar se espera
  // un poco, y las frases que llegan mientras tanto van detrás, en orden.
  let speechGen = 0, speechReadyAt = 0;
  function speak(text, who = 'narr', interrupt = false) {
    if (muted || !synth || !text) return;
    try {
      if (interrupt) {
        speechGen++;
        if (synth.speaking || synth.pending) { synth.cancel(); speechReadyAt = Date.now() + 150; }
      }
      const gen = speechGen;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'es-ES';
      if (voice) u.voice = voice;
      const v = VOICE[who] || VOICE.narr;
      u.pitch = v.pitch; u.rate = v.rate;
      const go = () => {
        if (gen !== speechGen) return;
        try { synth.resume(); synth.speak(u); } catch (e) { /* nada */ }
      };
      const wait = speechReadyAt - Date.now();
      if (wait > 0) setTimeout(go, wait); else go();
    } catch (e) { /* el navegador no deja hablar */ }
  }
  // Botón «Probar sonido»: dice en qué falla el sonido en este móvil.
  function soundCheck(el, muteKey) {
    muted = false; store.set(muteKey, false); syncMute();
    ensureAudio(); sfx.ok();
    if (!synth) {
      el.textContent = 'Este navegador no tiene voz. Abre el enlace en Chrome (Android) o Safari (iPhone), no dentro de otra app.';
      return;
    }
    let started = false;
    el.textContent = 'Probando…';
    const u = new SpeechSynthesisUtterance('¡Hola! Así suena la voz del juego.');
    u.lang = 'es-ES';
    if (voice) u.voice = voice;
    u.onstart = () => {
      started = true;
      el.textContent = '✓ La voz funciona.' + (voice ? '' : ' No hay voz en español instalada: puede sonar con acento.');
    };
    try { if (synth.speaking || synth.pending) synth.cancel(); synth.resume(); synth.speak(u); } catch (e) { /* nada */ }
    setTimeout(() => {
      if (!started) el.textContent = 'No se oye la voz. Sube el volumen, quita el modo silencio y, en Android, instala «Síntesis de voz de Google».';
    }, 2500);
  }

  // ---------- Letras ----------
  const ALPHABET = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
  const cap = str => str.charAt(0).toUpperCase() + str.slice(1);
  // Las vocales se alargan para que se oiga su sonido; el resto se apoya en una palabra.
  const SOUND = { A: 'aaa', E: 'eee', I: 'iii', O: 'ooo', U: 'uuu' };
  const NAME = {
    A: 'a', B: 'be', C: 'ce', D: 'de', E: 'e', F: 'efe', G: 'ge', H: 'hache', I: 'i', J: 'jota', K: 'ka', L: 'ele', M: 'eme',
    N: 'ene', Ñ: 'eñe', O: 'o', P: 'pe', Q: 'cu', R: 'erre', S: 'ese', T: 'te', U: 'u', V: 'uve', W: 'uve doble', X: 'equis', Y: 'ye', Z: 'zeta',
  };

  function drawSprite(g, rows, x, y, s, flipY = false) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[flipY ? rows.length - 1 - r : r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        g.fillStyle = PAL[ch];
        g.fillRect(x + c * s, y + r * s, s, s);
      }
    }
  }
  // Apoya los pies en (cx, bottom), así las poses de distinto tamaño no saltan.
  function drawSpriteAt(g, rows, cx, bottom, s, flipY) {
    drawSprite(g, rows, Math.round(cx - rows[0].length * s / 2), bottom - rows.length * s, s, flipY);
  }

  // ---------- Estado ----------
  const S = {

  if (!MODES[S.mode]) S.mode = 'poco';
  const timers = new Set();
  function later(fn, ms) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); }
  function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

  const phase = () => PHASES[S.run ? S.run.phase : 0];
  const dinoRows = (frame) => SPRITES[phase().dino + '_' + frame];
  function newRun(mode, speed) {
    return { mode, speed, phase: 0, got: 0, hearts: 3, found: [], missed: [], recent: [], usedAbuela: false, usedAbuelo: false };
  }
  function poolFor(r) {
    const m = MODES[r.mode];
    return [...new Set((m.phases ? m.phases[Math.min(r.phase, m.phases.length - 1)] : m.letters).split(''))];
  }

  // ---------- Preguntas ----------
  function makeQuestion() {
    const r = S.run, pool = poolFor(r);
    let target = pick(pool);
    for (let i = 0; i < 20 && r.recent.includes(target); i++) target = pick(pool);
    r.recent.push(target);
    if (r.recent.length > Math.min(3, pool.length - 1)) r.recent.shift();
    const types = ['see', 'see'];
    if (r.phase >= 1 && WORDS[target]) types.push('word');
    if (r.phase >= 2) types.push('hear');
    if (r.phase >= 3 && WORDS[target]) types.push('word');
    const type = pick(types);
    const n = Math.min(r.phase === 0 ? 3 : 4, pool.length);
    const opts = [target];
    const conf = (CONFUSE[target] || '').split('').filter(l => pool.includes(l));
    if (r.phase >= 2 && conf.length) opts.push(pick(conf));
    for (const l of shuffle(pool)) { if (opts.length >= n) break; if (!opts.includes(l)) opts.push(l); }
    const q = { type, letter: target, options: shuffle(opts) };
    if (type === 'word') { const [emoji, word] = pick(WORDS[target]); q.emoji = emoji; q.word = word; }
    else if (WORDS[target]) q.pic = pick(WORDS[target]);
    return q;
  }
  function promptSpeech(q) {
    if (q.type === 'word') return `¿Con qué letra empieza ${q.word.toLowerCase()}?`;
    const n = NAME[q.letter];
    const snd = SOUND[q.letter] ? `${SOUND[q.letter]}... ` : '';
    const pic = q.pic ? `, como ${q.pic[1].toLowerCase()}` : '';
    return `¿Dónde está la ${n}? ${snd}La ${n}${pic}.`;
  }
  function hintFor(q) {
    if (q.type === 'word') return { pic: '', say: `${q.word.toLowerCase()}... empieza por la ${NAME[q.letter]}.` };
    const w = q.pic || (WORDS[q.letter] || [])[0];
    if (!w) return { pic: '', say: `¡Busca la ${NAME[q.letter]}!` };
    return { pic: w[0], say: `¡La ${NAME[q.letter]}, de ${w[1].toLowerCase()}!` };
  }
  function timeFor() {
    const base = S.run.speed === 'rapido' ? 20 : 30;
    return Math.max(14, base - S.run.phase * 2 + (S.q && S.q.type === 'word' ? 5 : 0));
  }

  // ---------- Pintado ----------
  function draw() {
    const ph = phase();
    BACKDROPS[ph.bg]();
    S.props.forEach(p => { if (p.under) ITEMS[p.kind](p.x(), p.y()); });

    // dino
    const eating = S.t < S.pauseUntil && S.pauseKind === 'eat';
    const biting = S.screen === 'bite' && S.dinoX < CATCH + 6;
    let frame = 'A';
    if (biting) frame = 'BITE';
    else if (eating) frame = Math.floor(S.t * 4) % 2 ? 'BITE' : 'A';
    else if (S.screen === 'play' || Math.abs(S.dinoTarget - S.dinoX) > 0.5) frame = Math.floor(S.t * (ph.fly ? 6 : 5)) % 2 ? 'B' : 'A';
    const rows = dinoRows(frame);
    const bottom = ph.fly ? 56 + Math.round(Math.sin(S.t * 3) * 3) : FEET;
    if (S.falling) {
      drawSprite(ctx, rows, Math.round(S.dinoX), bottom - rows.length * SPR + Math.round(S.falling * 30), SPR, true);
    } else {
      drawSprite(ctx, rows, Math.round(S.dinoX), bottom - rows.length * SPR, SPR);
    }

    // familia que viene a ayudar
    if (S.helper && S.t < S.helper.until) {
      const sp = { dani: SPRITES.DANI_YAY, abuela: SPRITES.ABUELA, abuelo: SPRITES.ABUELO }[S.helper.who];
      drawSpriteAt(ctx, sp, HELPER_CX, FEET, SPR);
      if (S.helper.who === 'abuelo') ITEMS.umbrella(HELPER_CX + 12, 32);
    }

    // Alvarito
    const hulk = S.t < S.hulkUntil, roar = S.t < S.roarUntil;
    const jy = S.jump > 0 ? Math.round(Math.sin((1 - S.jump / 0.5) * Math.PI) * 8) : 0;
    const bob = S.screen === 'play' && Math.floor(S.t * 2) % 2 ? 1 : 0;
    const alva = hulk ? SPRITES.ALVA_HULK : roar ? SPRITES.ALVA_ROAR : SPRITES.ALVA_A;
    drawSpriteAt(ctx, alva, ALVA_CX, FEET - jy + bob, SPR);
    if (S.sling) ITEMS.slingshot(ALVA_CX + 22, FEET - 34);

    S.props.forEach(p => { if (!p.under) ITEMS[p.kind](p.x(), p.y()); });
    S.fx.forEach(f => {
      const p = Math.min(1, (S.t - f.t0) / f.dur);
      ITEMS[f.kind](f.x0 + (f.x1 - f.x0) * p, f.y0 + (f.y1 - f.y0) * p - f.arc * 4 * p * (1 - p));
    });
  }

  function answer(btn, l) {

    ensureAudio();
    const q = S.q, r = S.run;
    if (l === q.letter) {
      correct(btn);
    } else {
      btn.classList.add('wrong');
      btn.disabled = true;
      sfx.bad();
      S.left = Math.max(0, S.left - 4);
      if (!r.missed.includes(q.letter)) r.missed.push(q.letter);
      speak(`Esa es la ${NAME[l]}.`, 'narr', true);
      speak(q.type === 'word' ? `¿Con qué letra empieza ${q.word.toLowerCase()}?` : `Busca la ${NAME[q.letter]}.`);
      say('¡ÑAM, ÑAM!', () => S.dinoX + 16, 1.2);
    }
  }

  function correct(btn) {
    const q = S.q, r = S.run, ph = phase();
    S.screen = 'anim';
    revealAnswer();
    btn.classList.add('right');
    r.got++;
    if (!r.found.includes(q.letter)) r.found.push(q.letter);
    updateHud(); updateHelpers();
    sfx.ok();
    later(sfx.hulk, 250);
    S.hulkUntil = S.t + 2.8; S.jump = 0.5;
    flash('¡HULK!', 'green', 700);
    speak(q.type === 'word' ? `¡Sí! ${q.word.toLowerCase()}, con la ${NAME[q.letter]}.` : `¡Sí! ¡La ${NAME[q.letter]}!`, 'narr', true);

    if (ph.boss && r.got >= ph.need) { finalShot(); return; }

    const trap = pick(TRAPS);
    later(() => say(trap.text, ALVA_CX, 1.6, 'alva'), 300);
    if (trap.item === 'bucket') S.props.push({ kind: 'bucket', x: () => dinoHead().x, y: () => dinoHead().y - 10 });
    else if (trap.item === 'feather') S.props.push({ kind: 'feather', x: () => dinoHead().x - 6, y: () => dinoHead().y + 4 });
    else if (trap.item !== 'smash') S.props.push({ kind: trap.item, under: true, x: () => S.dinoX + 18, y: () => FEET - 2 });
    later(() => {
      if (trap.item === 'bucket') sfx.splash(); else sfx.boing();
      if (trap.item === 'smash') { shake(); flash('¡ZAS!', '', 600); }
      S.left = S.T;                               // el dino sale disparado hacia atrás
      S.props.push({ kind: 'stars', x: () => dinoHead().x + 6, y: () => dinoHead().y - 4 });
    }, 700);
    later(() => say(pick(['¡AY, AY!', '¡JO!', '¡AAARGH!']), () => S.dinoX + 16, 1.2), 1900);
    later(() => {
      if (r.got >= ph.need) phaseComplete(); else { S.q = null; startQuestion(); }
    }, 2900);
  }

  function finalShot() {
    S.sling = true;
    S.hulkUntil = S.t + 10;
    later(() => say('¡Toma, T-Rex!', ALVA_CX, 1.6, 'alva'), 400);
    later(() => {
      sfx.throw();
      const h = dinoHead();
      S.fx.push({ kind: 'stone', x0: ALVA_CX + 22, y0: FEET - 38, x1: h.x + 4, y1: h.y + 2, arc: 10, t0: S.t, dur: 0.6, hit: () => {
        sfx.chomp(); sfx.roar(); shake();
        flash('¡TOMA!', '', 1600);
        S.props.push({ kind: 'stars', x: () => dinoHead().x + 6, y: () => dinoHead().y - 4 });
        S.falling = 0.0001;
      } });
    }, 1300);
    later(victory, 3900);
  }

  // Si el dino llega no hace falta leer nada: el juego sigue solo.
  function bite() {
    const r = S.run;
    S.screen = 'bite';
    document.querySelectorAll('.ans').forEach(b => { b.disabled = true; });
    updateHelpers();
    later(() => {
      sfx.chomp(); shake();
      flash('¡ÑAM!', '', 1200);
      S.roarUntil = S.t + 2.5;
      r.hearts--;
      if (!r.missed.includes(S.q.letter)) r.missed.push(S.q.letter);
      updateHud();
      revealAnswer();
      say('¡Ñam, ñam! ¡Qué bocao!', () => S.dinoX + 16, 1.8, 'dino', true);
      speak(`Era la ${NAME[S.q.letter]}.`);
      later(() => {
        if (r.hearts <= 0) { gameOver(); return; }
        S.left = S.T; S.q = null; startQuestion();
      }, 3400);
    }, 450);
  }

  // ---------- Ayudas ----------
  function callDani() {
    if (S.screen !== 'play' || S.t < S.daniReadyAt) return;
    ensureAudio();
    S.daniReadyAt = S.t + 10;
    S.helper = { who: 'dani', until: S.t + 3 };
    const idea = pick(IDEAS);
    say(idea.text, HELPER_CX + 14, 2, 'dani', true);
    sfx.throw();
    S.fx.push({ kind: idea.item, x0: HELPER_CX + 8, y0: FEET - 46, x1: Math.min(W - 10, S.dinoX + 40), y1: FEET - 6, arc: 18, t0: S.t, dur: 0.9, hit: () => {
      S.pauseUntil = S.t + 3; S.pauseKind = 'distract';
      S.left = Math.min(S.T, S.left + S.T * 0.25);
    } });
    // pista: quita una letra que no es y repite cómo suena la buena
    const wrong = [...document.querySelectorAll('.ans:not(:disabled)')].filter(b => b.dataset.l !== S.q.letter);
    if (wrong.length > 1) { const b = pick(wrong); b.disabled = true; b.classList.add('gone'); }
    const h = hintFor(S.q);
    // el dibujo solo hace falta cuando la letra no se ve (reto de solo oír)
    $('hint').textContent = h.pic;
    $('hint').hidden = !(h.pic && S.q.type === 'hear');
    speak(h.say, 'dani');
    updateHelpers();
  }
  function callAbuela() {
    const r = S.run;
    if (S.screen !== 'play' || r.usedAbuela) return;
    ensureAudio();
    r.usedAbuela = true;
    S.helper = { who: 'abuela', until: S.t + 3.5 };
    say('¡Pescaíto frito para los dinos!', HELPER_CX + 14, 2.4, 'abuela', true);
    for (let i = 0; i < 3; i++) {
      later(() => {
        sfx.throw();
        const h = dinoHead();
        S.fx.push({ kind: 'fish', x0: HELPER_CX + 6, y0: FEET - 40, x1: h.x - 4 + i * 3, y1: h.y + 10, arc: 16, t0: S.t, dur: 0.7, hit: () => {
          if (i === 0) { S.pauseUntil = S.t + 8; S.pauseKind = 'eat'; say('¡ÑAM, ÑAM, ÑAM!', () => S.dinoX + 16, 2); }
        } });
      }, i * 250);
    }
    later(() => speak(promptSpeech(S.q)), 2600);
    updateHelpers();
  }
  function callAbuelo() {
    const r = S.run;
    if (S.screen !== 'play' || r.usedAbuelo) return;
    ensureAudio();
    r.usedAbuelo = true;
    S.helper = { who: 'abuelo', until: S.t + 3 };
    say('¡Fuera de aquí, dino!', HELPER_CX + 14, 2, 'abuelo', true);
    sfx.whoosh();
    later(() => { S.left = S.T; S.pauseUntil = S.t + 1.5; S.pauseKind = 'scared'; sfx.boing(); }, 400);
    later(() => speak(promptSpeech(S.q)), 2200);
    updateHelpers();
  }
  $('helpDani').addEventListener('click', callDani);
  $('helpAbuela').addEventListener('click', callAbuela);
  $('helpAbuelo').addEventListener('click', callAbuelo);
  $('target').addEventListener('click', () => { ensureAudio(); if (S.q && S.screen === 'play') speak(promptSpeech(S.q), 'narr', true); });

  // ---------- Final de fase y de partida ----------
  // Las fichas de letras se pueden tocar para oírlas.
  function lettersHtml(list, cls = '') {
    return `<div class="letters ${cls}">${list.map(l => `<button type="button" data-say="${l}" aria-label="Letra ${NAME[l]}">${l}</button>`).join('')}</div>`;
  }
  $('card').addEventListener('click', e => {
    const b = e.target.closest('[data-say]');
    if (b) { ensureAudio(); speak(`La ${NAME[b.dataset.say]}`, 'narr', true); }
  });

  function phaseComplete() {
    clearTimers();
    const r = S.run, ph = phase();
    S.screen = 'phase';
    sfx.phase();
    const line = `¡Bien! ${cap(ph.who)} se ha ido corriendo. ¡Alvarito es un súper Hulk!`;
    showCard(`
      <canvas class="art" id="hulkArt"></canvas>
      ${lettersHtml(r.found)}
      <p class="small">${line}</p>
    `, [{ label: '<span class="ico">▶</span>', aria: 'Siguiente fase', cls: 'green', go: () => { r.phase++; showPhaseIntro(); } }], { say: line });
    paintArt('hulkArt', 30, 28, g => drawSpriteAt(g, SPRITES.ALVA_HULK, 15, 26, 1));
    $('hulkArt').style.width = '120px';
  }

  function victory() {
    clearTimers();
    const r = S.run;
    S.screen = 'end';
    sfx.phase();
    const line = '¡Toma! ¡Alvarito ha vencido al T-Rex! Lo ha dejado viendo estrellitas.';
    showCard(`
      <canvas class="art" id="winArt"></canvas>
      ${lettersHtml(r.found)}
      ${r.missed.length ? `<h2>PARA REPASAR</h2>${lettersHtml(r.missed, 'miss')}` : ''}
      <p class="small">${line}</p>
    `, [
      { label: '<span class="ico">↻</span>', aria: 'Jugar otra vez', cls: 'green', go: () => startRun(r.speed) },
      { label: '<span class="ico">🏠</span>', aria: 'Volver al inicio', cls: 'ghost', go: showTitle },
    ], { say: line, row: true });
    paintArt('winArt', 92, 46, g => {
      g.fillStyle = '#21493e'; g.fillRect(0, 42, 92, 4);
      drawSpriteAt(g, SPRITES.ALVA_HULK, 14, 43, 1);
      drawSprite(g, SPRITES.TREX_A, 40, 43 - SPRITES.TREX_A.length, 1, true);
      g.fillStyle = '#ffd23f';
      [[46, 6], [56, 3], [66, 7]].forEach(([x, y]) => { g.fillRect(x, y - 1, 1, 3); g.fillRect(x - 1, y, 3, 1); });
    });
  }

  function gameOver() {
    const r = S.run, ph = phase();
    S.screen = 'end';
    sfx.lose();
    const line = `Esta vez ha ganado ${ph.who}. ¡Vamos a intentarlo otra vez!`;
    showCard(`
      <canvas class="art" id="loseArt"></canvas>
      ${r.missed.length ? `<h2>PARA REPASAR</h2>${lettersHtml(r.missed, 'miss')}` : ''}
      <p class="small">${line}</p>
    `, [
      { label: '<span class="ico">↻</span>', aria: 'Intentarlo otra vez', cls: 'green', go: () => { r.hearts = 3; showPhaseIntro(); } },
      { label: '<span class="ico">🏠</span>', aria: 'Volver al inicio', cls: 'ghost', go: showTitle },
    ], { say: line, row: true });
    const rows = dinoRows('BITE');
    paintArt('loseArt', rows[0].length + 26, rows.length + 4, g => {
      drawSpriteAt(g, SPRITES.ALVA_ROAR, 11, rows.length + 2, 1);
      drawSprite(g, rows, 22, 2, 1);
    });
    $('loseArt').style.width = Math.min(260, (rows[0].length + 26) * 3) + 'px';
  }

  // ---------- Bucle ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    S.t += dt;
    if (S.screen === 'play' && !document.hidden && S.t >= S.pauseUntil) {
      const before = S.left;
      S.left -= dt;
      if (Math.ceil(before) !== Math.ceil(S.left) && S.left <= 5 && S.left > 0) sfx.tick();
      if (!S.lastSaid && S.left < 5) { S.lastSaid = true; say('¡Que te como!', () => S.dinoX + 16, 1.5); }
      if (S.left <= 0) { S.left = 0; bite(); }
    }
    if (S.screen === 'play' || S.screen === 'anim' || S.screen === 'bite') updateTimer();
    S.dinoTarget = S.screen === 'bite' ? CATCH : START - (START - CATCH) * Math.min(1, 1 - S.left / S.T);
    S.dinoX += (S.dinoTarget - S.dinoX) * Math.min(1, dt * (S.screen === 'bite' ? 9 : 5));
    if (S.falling) S.falling = Math.min(1, S.falling + dt * 1.2);
    if (S.jump > 0) S.jump = Math.max(0, S.jump - dt);
    S.fx = S.fx.filter(f => { if (S.t - f.t0 >= f.dur) { if (f.hit) f.hit(); return false; } return true; });
    draw();
    updateBubble();
    updateHelpers();
    requestAnimationFrame(loop);
  }

  // ---------- Botones de la familia con su cara ----------
  [['helpDani', SPRITES.DANI], ['helpAbuela', SPRITES.ABUELA], ['helpAbuelo', SPRITES.ABUELO]].forEach(([id, rows]) => {
    const c = $(id).querySelector('canvas');
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    drawSprite(g, rows.slice(0, 15), 0, 1, 1);
  });

  // ---------- Sonido on/off ----------
  const muteBtn = $('mute');
  function syncMute() {
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? 'Poner el sonido' : 'Quitar el sonido');
  }
  muteBtn.addEventListener('click', () => {
    muted = !muted; store.set('ad-muted', muted); syncMute();
    if (muted && synth) { try { synth.cancel(); } catch (e) { /* nada */ } }
    ensureAudio(); sfx.click();
  });
  syncMute();

  // ---------- Arranque (conserva la partida si la página se actualiza) ----------
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ run: S.run, mode: S.mode }));
  function start(data) {
    if (data && data.run) {
      S.mode = data.mode || S.mode;
      S.run = Object.assign(newRun(S.mode, 'calma'), data.run);
      showPhaseIntro();
    } else {
      showTitle();
    }
    requestAnimationFrame(t => { last = t; loop(t); });
  }
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
<!-- juego:fin -->
</body>
