[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "I", "DJ"]
ignore = ["DJ001", "DJ012"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "bookings", "campings", "config", "core", "panel", "public", "tests"]

[tool.ruff.lint.per-file-ignores]
# Long multilingual demo texts.
"campings/demo.py" = ["E501"]
