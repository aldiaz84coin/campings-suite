# Fly.io configuration. Change `app` to your own app name (it must be unique),
# or run `fly launch --copy-config --no-deploy` and let it fill it in.
app = "campings-suite"
primary_region = "mad"

[build]

[deploy]
  # Migrations and the first superuser, before each release goes live.
  release_command = "sh bin/release.sh"

[env]
  PORT = "8000"
  LANGUAGE_CODE = "es"
  TIME_ZONE = "Europe/Madrid"
  WEB_CONCURRENCY = "2"

[http_service]
  internal_port = 8000
  force_https = true
  # Machines stop when idle and start on the next request: minimal cost.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
